<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Onsra Management</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/images/cropped-512-32x32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/images/cropped-512-180x180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --accent: #c7b299;
            --text-light: #f5f5f5;
            --text-muted: #888888;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 2rem 1.5rem;
        }
        header .logo img {
            height: 44px;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            margin: auto 0;
        }
        .code {
            font-family: 'Syne', sans-serif;
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 800;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.25);
            margin-bottom: 1rem;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        footer {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <img src="/images/logo.svg" alt="Onsra Management">
        </a>
    </header>

    <main>
        <div class="code">404</div>
        <h1>EXPERIENCE NOT FOUND</h1>
        <p>The page you are looking for has been moved or does not exist. Let's get you back on track.</p>
        <a href="/" class="home-btn">
            <span>&larr; BACK TO HOME</span>
        </a>
    </main>

    <footer>
        <p>&copy; 2026 Onsra Management. All rights reserved.</p>
    </footer>
</body>
</html>
